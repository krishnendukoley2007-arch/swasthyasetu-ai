<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1240" viewBox="0 0 1640 1240" font-family="'DejaVu Sans Mono',Consolas,monospace">
  <style>
    .bg    { fill:#fbfbf7; }
    .box   { fill:#ffffff; stroke:#333; stroke-width:2; }
    .mcu   { fill:#eef4fb; stroke:#1f3b57; stroke-width:2.5; }
    .pwr   { fill:#fdf1ee; stroke:#8a3a22; stroke-width:2; }
    .sens  { fill:#f2f9f2; stroke:#2c5c2f; stroke-width:2; }
    .ana   { fill:#fff8e8; stroke:#8a6a1c; stroke-width:2; }
    .note  { fill:#f6f2fa; stroke:#5a4a78; stroke-width:1.5; }
    .warn  { fill:#fdeeee; stroke:#a32222; stroke-width:2; }
    .ttl   { font-size:26px; font-weight:bold; fill:#111; }
    .sub   { font-size:13px; fill:#555; }
    .hd    { font-size:15px; font-weight:bold; fill:#111; }
    .lb    { font-size:12.5px; fill:#111; }
    .sm    { font-size:11px; fill:#444; }
    .xs    { font-size:10px; fill:#666; }
    .net   { font-size:11.5px; font-weight:bold; }
    .w3v3  { stroke:#c62828; stroke-width:2.5; fill:none; }
    .wgnd  { stroke:#111;    stroke-width:2.5; fill:none; }
    .wsda  { stroke:#1565c0; stroke-width:2.2; fill:none; }
    .wscl  { stroke:#00838f; stroke-width:2.2; fill:none; }
    .wana  { stroke:#e65100; stroke-width:2.2; fill:none; }
    .wdig  { stroke:#2e7d32; stroke-width:2.2; fill:none; }
    .wbat  { stroke:#6a1b9a; stroke-width:2.5; fill:none; }
    .res   { fill:#fff; stroke:#111; stroke-width:1.6; }
  </style>

  <rect class="bg" x="0" y="0" width="1640" height="1240"/>

  <text class="ttl" x="30" y="34">SwasthyaSetu AI — sensor board wiring diagram</text>
  <text class="sub" x="30" y="55">ESP32-WROOM-32 DevKit · rev 1.0 · pin assignments per docs/HARDWARE.md · all logic 3.3 V · nets with the same label are the same wire</text>

  <!-- ══════════════════════════ POWER TREE ══════════════════════════ -->
  <rect class="pwr" x="30" y="76" width="1050" height="146" rx="6"/>
  <text class="hd" x="42" y="96">POWER TREE</text>

  <!-- battery -->
  <rect class="box" x="46" y="112" width="118" height="66" rx="4"/>
  <text class="lb" x="105" y="132" text-anchor="middle">BT1</text>
  <text class="sm" x="105" y="148" text-anchor="middle">18650 Li-ion</text>
  <text class="sm" x="105" y="164" text-anchor="middle">3.7 V protected</text>

  <!-- switch -->
  <path class="wbat" d="M164 145 H196"/>
  <rect class="box" x="196" y="120" width="84" height="50" rx="4"/>
  <text class="lb" x="238" y="140" text-anchor="middle">SW1</text>
  <text class="sm" x="238" y="157" text-anchor="middle">slide SPST</text>

  <!-- TP4056 -->
  <path class="wbat" d="M280 145 H316"/>
  <rect class="box" x="316" y="108" width="150" height="74" rx="4"/>
  <text class="lb" x="391" y="128" text-anchor="middle">TP4056</text>
  <text class="sm" x="391" y="144" text-anchor="middle">charge + protect</text>
  <text class="xs" x="391" y="159" text-anchor="middle">B+/B− → cell</text>
  <text class="xs" x="391" y="173" text-anchor="middle">USB-C 5 V in</text>

  <!-- AMS1117 -->
  <path class="wbat" d="M466 145 H510"/>
  <text class="net" x="488" y="138" fill="#6a1b9a" text-anchor="middle">VBAT</text>
  <rect class="box" x="510" y="112" width="150" height="66" rx="4"/>
  <text class="lb" x="585" y="132" text-anchor="middle">AMS1117-3.3</text>
  <text class="sm" x="585" y="148" text-anchor="middle">LDO regulator</text>
  <text class="xs" x="585" y="164" text-anchor="middle">≈1 V dropout</text>

  <!-- 3V3 node + bulk caps -->
  <path class="w3v3" d="M660 145 H860"/>
  <text class="net" x="760" y="137" fill="#c62828" text-anchor="middle">+3V3</text>
  <!-- C1 -->
  <path class="w3v3" d="M700 145 V178"/>
  <path class="wgnd" d="M694 178 H706 M694 186 H706 M700 186 V206"/>
  <text class="xs" x="712" y="186">C1 10 µF</text>
  <!-- C2 -->
  <path class="w3v3" d="M800 145 V178"/>
  <path class="wgnd" d="M794 178 H806 M794 186 H806 M800 186 V206"/>
  <text class="xs" x="812" y="186">C2 100 nF</text>
  <path class="wgnd" d="M700 206 H860"/>
  <text class="net" x="800" y="220" fill="#111" text-anchor="middle">GND</text>

  <!-- battery sense divider -->
  <path class="wbat" d="M488 145 V196 H600"/>
  <rect class="res" x="600" y="188" width="34" height="16"/>
  <text class="xs" x="617" y="184" text-anchor="middle">R1 100k</text>
  <path class="wbat" d="M634 196 H676"/>
  <circle cx="676" cy="196" r="3.5" fill="#6a1b9a"/>
  <text class="net" x="700" y="200" fill="#6a1b9a">VBAT_SENSE →</text>
  <rect class="res" x="880" y="188" width="34" height="16"/>
  <text class="xs" x="897" y="184" text-anchor="middle">R2 100k</text>
  <path class="wbat" d="M676 196 H880"/>
  <path class="wgnd" d="M914 196 H960 V212"/>
  <path class="wgnd" d="M950 212 H970 M954 218 H966"/>
  <text class="xs" x="960" y="234" text-anchor="middle">GND</text>
  <text class="xs" x="990" y="192">C4 100 nF, VBAT_SENSE → GND</text>
  <text class="xs" x="990" y="206">V_bat = ADC/4095 × 3.3 × 2</text>

  <!-- ══════════════════════════ ESP32 ══════════════════════════ -->
  <rect class="mcu" x="560" y="300" width="440" height="700" rx="8"/>
  <text class="hd" x="780" y="332" text-anchor="middle">ESP32-WROOM-32</text>
  <text class="sm" x="780" y="352" text-anchor="middle">dual-core 240 MHz · BLE 4.2 · Wi-Fi</text>
  <text class="xs" x="780" y="370" text-anchor="middle">ADC2 is unusable while the radio is on —</text>
  <text class="xs" x="780" y="384" text-anchor="middle">every analog net below is on ADC1 (GPIO32–39)</text>
  <rect class="box" x="640" y="900" width="280" height="76" rx="4" fill="#dce8f5"/>
  <text class="lb" x="780" y="924" text-anchor="middle">BLE GATT server</text>
  <text class="xs" x="780" y="942" text-anchor="middle">svc 6e400001-b5a3-f393-e0a9-e50e24dcca9e</text>
  <text class="xs" x="780" y="958" text-anchor="middle">notify: vitals 20 B @ 4 Hz · ECG 250 Hz</text>
  <text class="xs" x="780" y="972" text-anchor="middle">no wiring — internal radio</text>

  <!-- ESP32 left pins -->
  <g class="lb">
    <text x="576" y="424">GPIO34</text><text class="xs" x="576" y="437">ADC1_CH6  in-only</text>
    <text x="576" y="480">GPIO32</text><text class="xs" x="576" y="493">ADC1_CH4</text>
    <text x="576" y="536">GPIO33</text><text class="xs" x="576" y="549">ADC1_CH5</text>
    <text x="576" y="592">GPIO35</text><text class="xs" x="576" y="605">ADC1_CH7  in-only</text>
    <text x="576" y="668">GPIO27</text><text class="xs" x="576" y="681">int. pull-up</text>
    <text x="576" y="744">GPIO25</text><text class="xs" x="576" y="757">DAC1 / out</text>
    <text x="576" y="836">3V3</text>
    <text x="576" y="872">GND</text>
  </g>
  <g class="wana">
    <path d="M560 420 H520"/><path d="M560 476 H520"/><path d="M560 532 H520"/>
  </g>
  <path class="wbat" d="M560 588 H520"/>
  <g class="wdig">
    <path d="M560 664 H520"/><path d="M560 740 H520"/>
  </g>
  <path class="w3v3" d="M560 832 H468"/>
  <path class="wgnd" d="M560 868 H468"/>

  <!-- ESP32 right pins -->
  <g class="lb">
    <text x="984" y="424" text-anchor="end">GPIO21</text><text class="xs" x="984" y="437" text-anchor="end">I2C0 SDA</text>
    <text x="984" y="480" text-anchor="end">GPIO22</text><text class="xs" x="984" y="493" text-anchor="end">I2C0 SCL</text>
    <text x="984" y="552" text-anchor="end">GPIO19</text><text class="xs" x="984" y="565" text-anchor="end">MAX INT (opt.)</text>
    <text x="984" y="616" text-anchor="end">GPIO18</text><text class="xs" x="984" y="629" text-anchor="end">MPU INT (opt.)</text>
    <text x="984" y="836" text-anchor="end">3V3</text>
    <text x="984" y="872" text-anchor="end">GND</text>
  </g>
  <path class="wsda" d="M1000 420 H1060"/>
  <path class="wscl" d="M1000 476 H1092"/>
  <g class="wdig">
    <path d="M1000 548 H1124"/><path d="M1000 612 H1124"/>
  </g>
  <path class="w3v3" d="M1000 832 H1560"/>
  <path class="wgnd" d="M1000 868 H1560"/>

  <!-- ══════════════════════════ I2C BUS ══════════════════════════ -->
  <path class="wsda" d="M1060 420 V800"/>
  <path class="wscl" d="M1092 476 V800"/>
  <text class="net" x="1046" y="410" fill="#1565c0" text-anchor="end">SDA</text>
  <text class="net" x="1106" y="466" fill="#00838f">SCL</text>

  <!-- pull-ups from 3V3 rail down to the bus -->
  <path class="w3v3" d="M860 145 H1180 V262"/>
  <path class="w3v3" d="M1060 262 H1180"/>
  <rect class="res" x="1044" y="262" width="16" height="34" transform="translate(0,0)"/>
  <path class="w3v3" d="M1060 296 V420"/>
  <text class="xs" x="1024" y="284" text-anchor="end">R3 4.7k</text>
  <path class="w3v3" d="M1092 300 V476"/>
  <rect class="res" x="1084" y="266" width="16" height="34"/>
  <path class="w3v3" d="M1092 266 V262"/>
  <text class="xs" x="1116" y="292">R4 4.7k</text>
  <text class="xs" x="1180" y="252">both pull-ups to +3V3 — the bus does not work without them</text>

  <!-- ══════════════════════════ I2C SENSORS ══════════════════════════ -->
  <!-- MAX30102 -->
  <rect class="sens" x="1124" y="386" width="436" height="86" rx="5"/>
  <text class="hd" x="1140" y="408">MAX30102 — PPG</text>
  <text class="sm" x="1140" y="426">heart rate · SpO₂ · pulse timing for PTT</text>
  <text class="xs" x="1140" y="442">I²C 0x57 · red 660 nm + IR 880 nm LEDs, 50 mA peaks</text>
  <text class="xs" x="1140" y="458">VCC 3V3 · GND · SDA · SCL · INT → GPIO19 (or poll)</text>
  <text class="xs" x="1552" y="464" text-anchor="end" fill="#a32222">needs C3 470 µF local bulk</text>
  <path class="wsda" d="M1060 420 H1124"/>
  <circle cx="1060" cy="420" r="3.5" fill="#1565c0"/>
  <path class="wscl" d="M1092 430 H1124"/>
  <circle cx="1092" cy="430" r="3.5" fill="#00838f"/>

  <!-- MLX90614 -->
  <rect class="sens" x="1124" y="486" width="436" height="86" rx="5"/>
  <text class="hd" x="1140" y="508">MLX90614 — IR thermopile</text>
  <text class="sm" x="1140" y="526">body temperature, non-contact 2–5 cm</text>
  <text class="xs" x="1140" y="542">I²C 0x5A · SMBus — 100 kHz ceiling, see note ②</text>
  <text class="xs" x="1140" y="558">VCC 3V3 (use the -BAA 3 V part) · GND · SDA · SCL</text>
  <path class="wsda" d="M1060 520 H1124"/>
  <circle cx="1060" cy="520" r="3.5" fill="#1565c0"/>
  <path class="wscl" d="M1092 530 H1124"/>
  <circle cx="1092" cy="530" r="3.5" fill="#00838f"/>

  <!-- MPU6050 -->
  <rect class="sens" x="1124" y="586" width="436" height="86" rx="5"/>
  <text class="hd" x="1140" y="608">MPU6050 — accel / gyro</text>
  <text class="sm" x="1140" y="626">on-board fall detection → frame flag bit1</text>
  <text class="xs" x="1140" y="642">I²C 0x68 (AD0 low) · INT → GPIO18 · VCC 3V3 · GND</text>
  <text class="xs" x="1140" y="658" fill="#a32222">③ referenced by the app, absent from the BOM — see notes</text>
  <path class="wsda" d="M1060 620 H1124"/>
  <circle cx="1060" cy="620" r="3.5" fill="#1565c0"/>
  <path class="wscl" d="M1092 630 H1124"/>
  <circle cx="1092" cy="630" r="3.5" fill="#00838f"/>

  <!-- SSD1306 -->
  <rect class="sens" x="1124" y="686" width="436" height="76" rx="5"/>
  <text class="hd" x="1140" y="708">SSD1306 — 0.96" OLED</text>
  <text class="sm" x="1140" y="726">128 × 64 local display, optional</text>
  <text class="xs" x="1140" y="742">I²C 0x3C · VCC 3V3 · GND · SDA · SCL</text>
  <path class="wsda" d="M1060 720 H1124"/>
  <circle cx="1060" cy="720" r="3.5" fill="#1565c0"/>
  <path class="wscl" d="M1092 730 H1124"/>
  <circle cx="1092" cy="730" r="3.5" fill="#00838f"/>

  <text class="xs" x="1124" y="784">All four share one bus: 4 wires total (3V3, GND, SDA, SCL) plus the two optional interrupts.</text>
  <text class="xs" x="1124" y="800">Addresses are fixed in silicon, so no conflict — an I²C scan at boot must return 0x3C, 0x57, 0x5A, 0x68.</text>

  <!-- ══════════════════════════ AD8232 ══════════════════════════ -->
  <rect class="ana" x="30" y="386" width="438" height="212" rx="5"/>
  <text class="hd" x="46" y="408">AD8232 — single-lead ECG front end</text>
  <text class="sm" x="46" y="426">instrumentation amp + 0.5–40 Hz band-pass + 2-pole notch</text>

  <text class="lb" x="46" y="452">OUTPUT</text>
  <path class="wana" d="M120 448 H520"/>
  <text class="xs" x="132" y="442">analog, 0–3.3 V, biased at ≈1.5 V mid-supply → GPIO34</text>
  <path class="wana" d="M520 448 V420"/>

  <text class="lb" x="46" y="484">LO+</text>
  <path class="wana" d="M120 480 H520 V476"/>
  <text class="xs" x="132" y="474">lead-off detect, electrode off skin → high  → GPIO32</text>

  <text class="lb" x="46" y="516">LO−</text>
  <path class="wana" d="M120 512 H520 V532"/>
  <text class="xs" x="132" y="506">lead-off detect  → GPIO33</text>

  <text class="lb" x="46" y="548">SDN</text>
  <text class="xs" x="132" y="548">tie to 3V3 = always enabled (per spec; wire to a GPIO to save power)</text>
  <path class="w3v3" d="M120 544 H300 V400 H468"/>

  <text class="xs" x="46" y="572">R5, R6 10 kΩ pull-downs on LO+/LO− · 3V3 + GND from the rails</text>
  <text class="xs" x="46" y="588" fill="#a32222">① set ADC1 attenuation to 11 dB or the 1.5 V bias clips — see notes</text>

  <!-- electrodes -->
  <rect class="ana" x="30" y="616" width="438" height="150" rx="5"/>
  <text class="hd" x="46" y="638">Electrodes — 3.5 mm TRS jack</text>
  <rect class="box" x="46" y="650" width="96" height="94" rx="4"/>
  <text class="sm" x="94" y="672" text-anchor="middle">J1</text>
  <text class="xs" x="94" y="690" text-anchor="middle">TIP  = IN+</text>
  <text class="xs" x="94" y="706" text-anchor="middle">RING = IN−</text>
  <text class="xs" x="94" y="722" text-anchor="middle">SLV  = REF</text>

  <g class="lb">
    <text x="164" y="676">RA  right arm / below right clavicle</text>
    <text x="164" y="702">LA  left arm / below left clavicle</text>
    <text x="164" y="728">RL  right lower abdomen  (reference)</text>
  </g>
  <text class="xs" x="46" y="760">Ag/AgCl snap electrodes only. 10 kΩ in series on each lead is standard current limiting.</text>

  <!-- ══════════════════════════ UI ══════════════════════════ -->
  <rect class="box" x="30" y="784" width="438" height="74" rx="5"/>
  <text class="hd" x="46" y="806">SW2 — user button</text>
  <text class="xs" x="46" y="824">GPIO27 → switch → GND. Internal pull-up in firmware; no external R.</text>
  <text class="xs" x="46" y="840">100 nF across the contacts if the firmware does not debounce.</text>
  <path class="wdig" d="M468 664 H320 V820"/>

  <rect class="box" x="30" y="874" width="438" height="112" rx="5"/>
  <text class="hd" x="46" y="896">Buzzer driver — SOS / alarm</text>
  <text class="xs" x="46" y="914">GPIO25 → R7 1 kΩ → base of Q1 (2N2222 / BC547)</text>
  <text class="xs" x="46" y="930">Q1 emitter → GND · collector → buzzer − · buzzer + → 3V3</text>
  <text class="xs" x="46" y="946">R8 100 Ω in series with the buzzer, D1 1N4148 across it if passive.</text>
  <text class="xs" x="46" y="966" fill="#a32222">④ do not drive the buzzer straight off the GPIO — 30 mA+ exceeds the</text>
  <text class="xs" x="46" y="980" fill="#a32222">   20 mA recommended per-pin limit; the pin survives but the rail dips.</text>
  <path class="wdig" d="M468 740 H300 V874"/>

  <!-- ══════════════════════════ NOTES ══════════════════════════ -->
  <rect class="note" x="30" y="1006" width="1010" height="196" rx="6"/>
  <text class="hd" x="46" y="1028">Design notes — the four things that actually bite</text>
  <text class="sm" x="46" y="1052">① <tspan font-weight="bold">ADC range.</tspan>  The AD8232 rests at half supply (≈1.5 V). ESP32 ADC1 defaults to a 0–1.1 V window, so the</text>
  <text class="sm" x="66" y="1068">baseline sits pinned at 4095 and the ECG looks flat. Set 11 dB attenuation (0–3.1 V). The ADC is also</text>
  <text class="sm" x="66" y="1084">non-linear near both ends — calibrate, or the R-peak amplitude is not comparable between boards.</text>
  <text class="sm" x="46" y="1108">② <tspan font-weight="bold">Bus speed.</tspan>  The MLX90614 is SMBus and tops out at 100 kHz; the MAX30102 wants 400 kHz for a clean</text>
  <text class="sm" x="66" y="1124">250 Hz FIFO read. Either run the whole bus at 100 kHz, or split: I2C0 on 21/22 at 400 kHz for MAX+MPU+OLED,</text>
  <text class="sm" x="66" y="1140">I2C1 on GPIO26/GPIO25 at 100 kHz for the MLX alone. (GPIO25 is the buzzer here — move it to GPIO14 first.)</text>
  <text class="sm" x="46" y="1164">③ <tspan font-weight="bold">Rail sag.</tspan>  MAX30102 LEDs pull 50 mA in bursts while the ESP32 TX pulls 250 mA. Without C3 470 µF within</text>
  <text class="sm" x="66" y="1180">20 mm of the MAX30102, the 3V3 rail dips far enough to NAK the I²C transfer — presents as a sensor that</text>
  <text class="sm" x="66" y="1196">"randomly disconnects". An AMS1117 has no headroom left at 3.7 V in, so a buck or a 2-cell pack is better.</text>

  <rect class="warn" x="1060" y="1006" width="550" height="196" rx="6"/>
  <text class="hd" x="1076" y="1028" fill="#a32222">Not a medical device</text>
  <text class="sm" x="1076" y="1050">No patient isolation barrier, no defibrillation protection,</text>
  <text class="sm" x="1076" y="1066">no IEC 60601 compliance. Two consequences that matter:</text>
  <text class="sm" x="1076" y="1090">· <tspan font-weight="bold">Never attach electrodes while USB is plugged in</tspan> to a</text>
  <text class="sm" x="1092" y="1106">mains-powered laptop or charger. Run on battery only.</text>
  <text class="sm" x="1076" y="1130">· The blood pressure figure is <tspan font-weight="bold">pulse-transit-time derived</tspan>,</text>
  <text class="sm" x="1092" y="1146">not a cuff measurement. The frame carries an explicit</text>
  <text class="sm" x="1092" y="1162">confidence byte for exactly that reason; the app labels it</text>
  <text class="sm" x="1092" y="1178">EXPERIMENTAL and the triage rules do not act on it alone.</text>

  <!-- legend -->
  <rect class="box" x="1096" y="76" width="514" height="146" rx="6"/>
  <text class="hd" x="1112" y="96">Net colours</text>
  <g stroke-width="3" fill="none">
    <path stroke="#c62828" d="M1112 112 H1152"/><text class="sm" x="1160" y="116">+3V3 rail</text>
    <path stroke="#111"    d="M1112 132 H1152"/><text class="sm" x="1160" y="136">GND</text>
    <path stroke="#6a1b9a" d="M1112 152 H1152"/><text class="sm" x="1160" y="156">VBAT (raw cell, 3.0–4.2 V)</text>
    <path stroke="#1565c0" d="M1360 112 H1400"/><text class="sm" x="1408" y="116">I²C SDA</text>
    <path stroke="#00838f" d="M1360 132 H1400"/><text class="sm" x="1408" y="136">I²C SCL</text>
    <path stroke="#e65100" d="M1360 152 H1400"/><text class="sm" x="1408" y="156">analog</text>
    <path stroke="#2e7d32" d="M1112 172 H1152"/><text class="sm" x="1160" y="176">digital GPIO</text>
  </g>
  <text class="xs" x="1112" y="198">● = junction (wires joined).  Crossing lines with no dot are not connected.</text>
  <text class="xs" x="1112" y="214">Every module also needs 100 nF from its VCC to GND, close to the pin.</text>
</svg>
