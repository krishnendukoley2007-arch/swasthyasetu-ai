# Sized to fit alongside the OS rather than to the machine's total RAM. -Xmx8G
# with a 4G metaspace asked for more than was free and the daemon was killed
# mid-build ("Gradle build daemon disappeared unexpectedly"), which reads like a
# toolchain fault rather than the OOM it is.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
