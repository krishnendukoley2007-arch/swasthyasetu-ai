name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: .
        run: flutter pub get

      - name: Generate code
        working-directory: .
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        working-directory: .
        run: flutter test

      - name: Build APKs (split per ABI)
        working-directory: .
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs for release
        working-directory: .
        run: |
          cd build/app/outputs/flutter-apk
          for f in *.apk; do
            mv "$f" "${f/app-release/SwasthyaSetu}"
          done

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 90

  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PlatformIO
        uses: platformio/platformio-action@v1
        with:
          args: 'run --environment esp32dev'

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/esp32dev/firmware.bin
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-firmware]
    timeout-minutes: 10
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: ./apks

      - name: Download Firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ./firmware

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" > changelog.txt
          else
            git log --pretty=format:"- %s (%h)" "${TAG}" > changelog.txt
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: SwasthyaSetu AI ${{ github.ref_name }}
          body: |
            ## 📱 Android APKs
            - **SwasthyaSetu-fixed.apk** — Universal (all architectures) — Recommended
            - **SwasthyaSetu-arm64-v8a.apk** — 64-bit ARM (most phones since 2018)
            - **SwasthyaSetu-armeabi-v7a.apk** — 32-bit ARM (older phones)
            - **SwasthyaSetu-x86_64.apk** — x86_64 (emulators)

            ## 🔧 Firmware
            - **firmware.bin** — ESP32 binary (flash with `esptool.py` or PlatformIO)

            ## 📝 Changes
            ${{ steps.changelog.outputs.changelog }}

            ---
            **Full changelog:** https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.prev_tag }}...${{ github.ref_name }}
            **Install guide:** See [README.md](../../blob/main/README.md#-install-on-your-phone-no-computer-needed)
          files: |
            ./apks/*.apk
            ./firmware/firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
