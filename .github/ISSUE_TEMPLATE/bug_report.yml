name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below so we can reproduce and fix it quickly.

  - type: input
    id: version
    attributes:
      label: App Version
      description: Build number from Settings → About (e.g., 1.3.0+4)
      placeholder: "1.3.0+4"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android (phone)
        - Android (emulator)
        - Other
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: "14 (API 34)"
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Mode when bug occurred
      options:
        - Demo mode (no sensor board)
        - Live mode (with sensor board)
        - Both
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered list, be specific
      placeholder: |
        1. Open app
        2. Go to Settings → AI
        3. Paste invalid API key
        4. Tap Save
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: "App should show validation error inline"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: "App crashes with red screen"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste `adb logcat` output, stack trace, or attach screenshots
      render: text
      placeholder: |
        ```
        E/Flutter (12345): [ERROR] ...
        ```

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I'm on the latest release (checked Releases page)
          required: false
        - label: I can reproduce this consistently
          required: false